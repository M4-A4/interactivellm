<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 650" width="1290" height="650" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Realtime web app architecture</title>
  <desc id="d">The browser streams microphone audio and camera frames over one WebSocket to the server. The server runs Silero VAD, MLX Whisper, a local LLM with camera frames, and Kokoro TTS, then streams the spoken reply back sentence by sentence. Speaking over the assistant cancels the reply (barge-in).</desc>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fe0"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12806a"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cd6"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1289" height="649" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1f2328">Realtime web app</text>
  <text x="30" y="60" font-size="13" fill="#57606a">One WebSocket carries mic audio and camera frames up, and the spoken reply back.</text>

  <!-- browser -->
  <rect x="24" y="76" width="262" height="530" rx="14" fill="#eef5ff" stroke="#9ec1ff" stroke-width="1.5"/>
  <text x="44" y="104" font-size="15" font-weight="700" fill="#1d4ba8">Browser</text>

  <rect x="44" y="146" width="222" height="84" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="155" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Camera</text>
  <text x="155" y="198" font-size="12.5" text-anchor="middle" fill="#57606a">~2 fps frames</text>

  <rect x="44" y="288" width="222" height="84" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="155" y="318" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Microphone</text>
  <text x="155" y="340" font-size="12.5" text-anchor="middle" fill="#57606a">16 kHz PCM</text>
  <text x="155" y="357" font-size="12.5" text-anchor="middle" fill="#57606a">with echo cancellation</text>

  <rect x="44" y="500" width="222" height="84" rx="10" fill="#ffffff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="155" y="530" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Speaker</text>
  <text x="155" y="552" font-size="12.5" text-anchor="middle" fill="#57606a">plays the reply as it arrives</text>
  <text x="155" y="569" font-size="12.5" text-anchor="middle" fill="#57606a">flushed on barge-in</text>

  <!-- websocket -->
  <rect x="312" y="130" width="36" height="460" rx="18" fill="#fff4e0" stroke="#f0a43a" stroke-width="1.5"/>
  <text transform="translate(335 437) rotate(-90)" font-size="13" font-weight="700" text-anchor="middle" fill="#8a5200">one WebSocket · /ws</text>

  <!-- server -->
  <rect x="376" y="76" width="884" height="530" rx="14" fill="#f7f4ff" stroke="#b9a5f0" stroke-width="1.5"/>
  <text x="396" y="104" font-size="15" font-weight="700" fill="#4a2fa0">Server</text>

  <!-- stage 1: VAD -->
  <rect x="404" y="255" width="180" height="150" rx="10" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
  <text x="494" y="283" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Silero VAD</text>
  <text x="494" y="303" font-size="12" text-anchor="middle" fill="#57606a">finds when you stop talking</text>
  <text x="494" y="331" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6a45c9">also spots barge-in</text>
  <text x="494" y="374" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">END_SILENCE_MS</text>
  <text x="494" y="390" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">VAD_THRESHOLD</text>

  <!-- stage 2: Whisper -->
  <rect x="620" y="255" width="180" height="150" rx="10" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
  <text x="710" y="283" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">MLX Whisper</text>
  <text x="710" y="303" font-size="12" text-anchor="middle" fill="#57606a">speech → text</text>
  <text x="710" y="331" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6a45c9">STT ~0.1–0.3 s</text>
  <text x="710" y="390" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">MLX_WHISPER_REPO</text>

  <!-- stage 3: LLM -->
  <rect x="836" y="255" width="180" height="150" rx="10" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
  <text x="926" y="283" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Local LLM</text>
  <text x="926" y="303" font-size="12" text-anchor="middle" fill="#57606a">Ollama / LM Studio + camera</text>
  <text x="926" y="331" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6a45c9">1st token ~0.2 s (text)</text>
  <text x="926" y="349" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6a45c9">~1.5 s with image</text>
  <text x="926" y="374" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">thinking off:</text>
  <text x="926" y="390" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">reasoning_effort=none</text>

  <!-- stage 4: TTS -->
  <rect x="1052" y="255" width="180" height="150" rx="10" fill="#ffffff" stroke="#7c5cd6" stroke-width="1.5"/>
  <text x="1142" y="283" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Kokoro TTS</text>
  <text x="1142" y="303" font-size="12" text-anchor="middle" fill="#57606a">text → speech</text>
  <text x="1142" y="331" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6a45c9">one sentence at a time</text>
  <text x="1142" y="390" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#57606a">KOKORO_VOICE</text>

  <!-- mic audio up: microphone -> VAD -->
  <path d="M266,330 H402" fill="none" stroke="#2f6fe0" stroke-width="2.5" marker-end="url(#aB)"/>

  <!-- pipeline arrows -->
  <path d="M584,330 H618" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#aG)"/>
  <path d="M800,330 H834" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#aG)"/>
  <path d="M1016,330 H1050" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#aG)"/>

  <!-- camera frames: camera -> LLM -->
  <path d="M266,188 H926 V253" fill="none" stroke="#12806a" stroke-width="2.5" marker-end="url(#aT)"/>
  <text x="420" y="178" font-size="12.5" fill="#12806a" font-weight="600">camera frames attached to each turn</text>
  <text x="420" y="212" font-size="12.5" fill="#12806a">a second frame is added if the scene changed while you spoke</text>

  <!-- spoken reply back: TTS -> speaker -->
  <path d="M1142,407 V542 H268" fill="none" stroke="#7c5cd6" stroke-width="2.5" marker-end="url(#aP)"/>
  <text x="420" y="531" font-size="12.5" fill="#6a45c9" font-weight="600">spoken reply, streamed sentence by sentence</text>
  <text x="420" y="562" font-size="12.5" fill="#6a45c9">first audio ~0.4–0.7 s after you stop talking</text>

  <!-- barge-in: VAD -> cancel LLM + TTS -->
  <path d="M494,407 V468 H1085 V407" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#aO)"/>
  <path d="M926,468 V407" fill="none" stroke="#d9480f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#aO)"/>
  <text x="506" y="488" font-size="12.5" fill="#d9480f" font-weight="600">barge-in: you talk over the assistant, so the reply is cancelled and playback is flushed</text>
  <text x="506" y="505" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d9480f">BARGE_IN_MS</text>

  <!-- footnote -->
  <text x="30" y="632" font-size="12" fill="#57606a">Latencies measured on an M5 Max. Local-model "thinking" is off: with it on, the first token took 3 s+ or never arrived (Ollama).</text>
</svg>
